[workspace]
resolver = "2"
members = ["sim", "logic"]
exclude = ["kernel"]

# The kernel/ crate is a bare-metal aarch64-unknown-none binary built from its
# own directory (it carries kernel/.cargo/config.toml pinning the target, the
# linker script, and the QEMU runner). It is excluded here so that host tooling
# such as `cargo test` and `cargo clippy` at the workspace root stay green on the
# host triple. Build and run it with:  cd kernel && cargo build --release

[profile.release]
opt-level = 3
